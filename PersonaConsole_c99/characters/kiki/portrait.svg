<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Kiki placeholder portrait: gold chrome cyborg, retro-futurist. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="60%" stop-color="#0e0a06"/>
      <stop offset="100%" stop-color="#040302"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f7d97a"/>
      <stop offset="30%"  stop-color="#e4b850"/>
      <stop offset="55%"  stop-color="#fff2c0"/>
      <stop offset="75%"  stop-color="#caa138"/>
      <stop offset="100%" stop-color="#8a6b1a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87f28"/>
      <stop offset="100%" stop-color="#5e4515"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff4c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- hair curls (40s-finger-wave silhouette) -->
  <path d="M72,86 Q60,68 80,56 Q100,46 128,48 Q156,46 176,56 Q196,68 184,86 Q172,76 152,76 Q140,84 128,82 Q116,84 104,76 Q84,76 72,86 Z"
        fill="url(#gold)"/>
  <ellipse cx="92" cy="78" rx="10" ry="8" fill="url(#goldDark)" opacity="0.4"/>
  <ellipse cx="164" cy="78" rx="10" ry="8" fill="url(#goldDark)" opacity="0.4"/>
  <!-- face -->
  <ellipse cx="128" cy="118" rx="44" ry="52" fill="url(#gold)"/>
  <!-- cheek highlight -->
  <circle cx="128" cy="120" r="36" fill="url(#cheek)"/>
  <!-- panel seam -->
  <path d="M128,72 L128,170" stroke="#7d5e1c" stroke-width="0.6" opacity="0.5"/>
  <path d="M104,108 Q128,114 152,108" fill="none" stroke="#7d5e1c" stroke-width="0.4" opacity="0.5"/>
  <!-- eyes -->
  <ellipse cx="110" cy="115" rx="6" ry="4" fill="#1a1208"/>
  <ellipse cx="146" cy="115" rx="6" ry="4" fill="#1a1208"/>
  <circle cx="111" cy="114" r="1.5" fill="#9ed4ff"/>
  <circle cx="147" cy="114" r="1.5" fill="#9ed4ff"/>
  <!-- brows -->
  <path d="M102,106 Q110,103 118,106" stroke="#5e4515" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M138,106 Q146,103 154,106" stroke="#5e4515" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M128,124 L124,140 L132,140 Z" fill="url(#goldDark)" opacity="0.5"/>
  <!-- lips -->
  <path d="M116,150 Q128,158 140,150 Q128,154 116,150 Z" fill="#c87a3a"/>
  <!-- neck + body plates -->
  <rect x="116" y="168" width="24" height="20" rx="2" fill="url(#goldDark)"/>
  <path d="M76,196 L100,180 Q128,176 156,180 L180,196 L180,256 L76,256 Z" fill="url(#gold)"/>
  <!-- chest panel -->
  <circle cx="128" cy="226" r="14" fill="url(#goldDark)" opacity="0.85"/>
  <circle cx="128" cy="226" r="6"  fill="#fff2c0" opacity="0.6"/>
</svg>
