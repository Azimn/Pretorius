<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PersonaHost - chat</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main class="app">
    <aside class="character">
      <div class="portrait" id="portrait">
        <img id="portrait-img" alt="" aria-hidden="true">
        <span id="portrait-initial">?</span>
      </div>
      <h1 id="character-name">...</h1>
      <p class="today" id="today-label"></p>
      <div class="presence" id="presence">waiting</div>
      <dl class="state">
        <dt>mood</dt>      <dd id="mood">-</dd>
        <dt>intent</dt>    <dd id="intent">-</dd>
        <dt>mode</dt>      <dd id="mode">-</dd>
        <dt>turn</dt>      <dd id="turn">0</dd>
        <dt>intox</dt>     <dd id="intox">0</dd>
        <dt>exhaust</dt>   <dd id="exhaust">0</dd>
        <dt>voice d</dt>   <dd id="voice-delta">0</dd>
        <dt>disp.</dt>     <dd id="disp">-</dd>
      </dl>
      <div class="inner-life">
        <h2>Inner Loop</h2>
        <div class="thought" id="current-thought">gathering himself</div>
        <div class="need">
          <span>focus</span>
          <div class="meter"><i id="need-focus"></i></div>
        </div>
        <div class="need">
          <span>energy</span>
          <div class="meter"><i id="need-energy"></i></div>
        </div>
        <div class="need">
          <span>rapport</span>
          <div class="meter"><i id="need-rapport"></i></div>
        </div>
        <button type="button" class="ghost-button" id="prompt-character">prompt character</button>
      </div>
      <div class="settings">
        <h2>Presence</h2>
        <label>
          <input type="checkbox" id="proactive-enabled">
          character may speak during quiet
        </label>
        <label>
          <input type="checkbox" id="speak-first">
          character may speak first
        </label>
        <label class="select-label">
          idle delay
          <select id="idle-delay">
            <option value="15000">15 sec</option>
            <option value="30000">30 sec</option>
            <option value="45000">45 sec</option>
            <option value="90000">90 sec</option>
            <option value="180000">3 min</option>
          </select>
        </label>
      </div>
      <div class="session-tools">
        <h2>Session</h2>
        <button type="button" class="ghost-button" id="export-transcript">export transcript</button>
        <p>Only exports this browser session when you click it.</p>
      </div>
    </aside>

    <section class="chat">
      <div class="messages" id="messages"></div>
      <form class="input-row" id="input-form" autocomplete="off">
        <input type="text" id="input" placeholder="say something..." autofocus>
        <button type="submit" id="send">send</button>
      </form>
    </section>
  </main>
  <script src="/web/app.js"></script>
</body>
</html>
